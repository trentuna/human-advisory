<svg xmlns="http://www.w3.org/2000/svg" width="320" height="168" viewBox="0 0 320 168" role="img" aria-labelledby="title desc">
  <title id="title">Human Advisory — Explicit AI Code</title>
  <desc id="desc">A three-row advisory style label inspired by old record warning labels, reinterpreted for AI code.</desc>
  <g transform="rotate(-2 160 84)">
    <rect x="18" y="18" width="284" height="132" fill="white" stroke="black" stroke-width="4"/>
    <rect x="18" y="18" width="284" height="40" fill="black"/>
    <rect x="18" y="58" width="284" height="34" fill="white"/>
    <rect x="18" y="92" width="284" height="58" fill="black"/>
    <line x1="18" y1="58" x2="302" y2="58" stroke="black" stroke-width="3"/>
    <line x1="18" y1="92" x2="302" y2="92" stroke="black" stroke-width="3"/>
    <text x="160" y="44" text-anchor="middle" fill="white"
      font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="24" letter-spacing="2">HUMAN</text>
    <text x="160" y="82" text-anchor="middle" fill="black"
      font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="24" letter-spacing="2">ADVISORY</text>
    <text x="160" y="127" text-anchor="middle" fill="white"
      font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="22" letter-spacing="1.2">EXPLICIT AI CODE</text>
  </g>
</svg>
